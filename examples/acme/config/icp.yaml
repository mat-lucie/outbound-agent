    - iiot
    - digital twin

  # C-level / VP executive signals (paired with an ops domain → executive_sponsors).
  executive_keywords:
    - cfo
    - coo
    - ceo
    - "vp "
    - vice president
    - chief
    - director general
    - c-level
    - svp
    - evp
    - president

  # Operations / manufacturing / supply-chain domain signals.
  operations_keywords:
    - operations
    - manufactur
    - production
    - plant manager
    - planta
    - supply chain
    - operaciones
    - producción
    - produção
    - scheduling
    - planning
    - gerente de planta
    - director de manufactura

  # Decision-maker titles (apply to all lanes). Substring matching, so shorter
  # forms subsume longer ones ("director" covers "director general", etc).
  decision_maker_keywords:
    - "vp "
    - director
    - diretor
    - head of
    - chief
    - president
    - ceo
    - coo
    - cfo
    - superintend
    - c-level
    - cto
    - cio
    - cdo
    # Regional country heads + GMs (not subsumed by the above)
    - general manager
    - gerente general
    - gerente geral
    - country manager
    - country head
    - regional head

  # False-positive guards on decision_maker_keywords. "coo" matches
  # "coordinator"/"coordinador"/"coordenador" via substring; these suppress the
  # spurious decision-maker credit. MUST be disjoint from decision_maker_keywords.
  decision_maker_exemptions:
    - coordinator
    - coordinador
    - coordenador

  # Generic influencer signals (manager / lead / gerente / jefe / líder).
  influencer_keywords:
    - manager
    - lead
    - gerente
    - jefe
    - líder
    - lider

