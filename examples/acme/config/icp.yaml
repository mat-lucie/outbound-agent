# ICP (Ideal Customer Profile) scoring configuration — Acme reference operator.
#
# This is the synthetic Acme example operator's ICP: a debranded, fully worked
# example of the scoring config. It holds the DETERMINISTIC scoring inputs only
# (keyword lists, industry buckets, numeric weights, thresholds, geography). The
# scoring MATH/LOGIC lives in workflows/quality_gate.py. The repo-root
# config/icp.example.yaml ships the same schema as the neutral default; the test
# suite pins to THIS file (see tests/conftest.py).
#
# The LLM tiebreaker prompt's narrative ICP slots live under `qualifier_prompt:`
# below; they feed config/prompts/qualifier.md.j2.
#
# Order matters for keyword lists scanned for the FIRST positional match
# (disqualifier families) — preserve the order when editing.

# ── LLM qualifier prompt slots ───────────────────────────────────────
# Narrative, ICP-specific pieces of the LLM tiebreaker's system prompt. These
# render through config/prompts/qualifier.md.j2 into QUALIFIER_SYSTEM_PROMPT.
qualifier_prompt:
  product_summary: "Acme (a B2B SaaS platform for mid-to-large enterprises)"

  geography_requirement: >-
    The prospect should sit at a company in your served market. Adjust or remove
    this gate to match where you actually sell.

  lanes:
    - >-
      **ICP 1 — Enterprise (PRIMARY):** Larger organizations with an established
      buying committee and budget for new tooling. Target buyer is the leader
      who owns the relevant function (e.g. VP / Director / Head of the team that
      would adopt the product), not an individual contributor.
    - >-
      **ICP 2 — Mid-market (SECONDARY):** Smaller, faster-moving companies where
      a single decision-maker (founder, owner, department head) can approve a
      purchase. Title is a clear decision-maker for the relevant function.

  disqualifiers:
    - "Consultants, freelancers, advisors (unless clearly an operational role inside a target company)"
    - "Academics, professors, researchers, students"
    - "Direct competitors and vendors selling a substitute product"
    - "Individuals with no authority or influence over the relevant buying decision"
    - "Roles in functions your product does not serve"
    - "Non-profits and institutions outside your commercial market (adjust if they are in-scope for you)"
    - "Junior / individual-contributor roles without manager scope"
    - "Sales / commercial / marketing roles — they sit on the revenue side and rarely own the buying decision for an operational tool. **Exception:** roles that explicitly own the function your product serves."

  lane_labels:
    - "enterprise"
    - "mid-market"

# ── Persona classification keywords ──────────────────────────────────
# Used by _classify_persona to bucket a prospect into a persona, and by the
# role-fit scorer to detect digitalization / executive / operations signals.
roles:
  # Digital-transformation / Industry 4.0 signals → digitalization_champions.
  digitalization_keywords:
    - digital
    - transformation
    - transformación
    - transformação
    - industry 4.0
    - industria 4.0
    - indústria 4.0
    - innovation
    - innovación
    - inovação
    - smart manufacturing
    - smart factory
    - fábrica inteligente
    - digitalización
    - digitalização
    - digitalization
    - i4.0
    - iot
    - iiot
    - digital twin

  # C-level / VP executive signals (paired with an ops domain → executive_sponsors).
  executive_keywords:
    - cfo
    - coo
    - ceo
    - "vp "
    - vice president
    - chief
    - director general
    - c-level
    - svp
    - evp
    - president

  # Operations / manufacturing / supply-chain domain signals.
  operations_keywords:
    - operations
    - manufactur
    - production
    - plant manager
    - planta
    - supply chain
    - operaciones
    - producción
    - produção
    - scheduling
    - planning
    - gerente de planta
    - director de manufactura

  # Decision-maker titles (apply to all lanes). Substring matching, so shorter
  # forms subsume longer ones ("director" covers "director general", etc).
  decision_maker_keywords:
    - "vp "
    - director
    - diretor
    - head of
    - chief
    - president
    - ceo
    - coo
    - cfo
    - superintend
    - c-level
    - cto
    - cio
    - cdo
    # Regional country heads + GMs (not subsumed by the above)
    - general manager
    - gerente general
    - gerente geral
    - country manager
    - country head
    - regional head

  # False-positive guards on decision_maker_keywords. "coo" matches
  # "coordinator"/"coordinador"/"coordenador" via substring; these suppress the
  # spurious decision-maker credit. MUST be disjoint from decision_maker_keywords.
  decision_maker_exemptions:
    - coordinator
    - coordinador
    - coordenador

  # Generic influencer signals (manager / lead / gerente / jefe / líder).
  influencer_keywords:
    - manager
    - lead
    - gerente
    - jefe
    - líder
    - lider

# ── Geography ─────────────────────────────────────────────────────────
geography:
  # Global-scope titles that drop out of scope for cold regional outreach.
  global_executive_keywords:
    - "global "
    - worldwide
    - group head

  # Titles that mention an in-region market are exempt from the global-only demote
  # (a regional head is in-scope despite the word "global").
  latam_geo_override:
    - mexico
    - méxico
    - brasil
    - brazil
    - chile
    - peru
    - colombia

  # Language detection by location (Portuguese / Spanish / English markets).
  pt_locations:
    - brazil
    - brasil
    - são paulo
    - rio de janeiro
    - belo horizonte
  es_locations:
    - mexico
    - méxico
    - colombia
    - argentina
    - chile
    - peru
    - perú
    - spain
    - españa
    - guadalajara
    - monterrey
    - bogotá
    - buenos aires
    - santiago
    - lima
    - madrid
    - barcelona
  en_locations:
    - united states
    - usa
    - canada
    - united kingdom
    - uk
    - australia
    - new york
    - chicago
    - houston
