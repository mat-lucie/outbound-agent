  # Carve-outs — description phrases in which the company asserts that IT runs
  # production. A company that both integrates and manufactures is judged on
  # the plant it owns, so any hit suppresses the family. Substring-matched, so
  # a shorter phrase subsumes its plural ("our plant" covers "our plants").
  #
  # Every phrase MUST carry its own SUBJECT:
  #   * A bare stem ("manufactur") reads as a carve-out in "a systems
  #     integrator serving discrete MANUFACTURERS" and un-catches the whole
  #     population this family exists for.
  #   * A bare genitive ("manufacturer of", "fabricante de") matches the OEM an
  #     integrator RESELLS — naming your vendor is standard integrator copy.
  # Deliberately NARROW: the industry half already requires the classifier to
  # have labelled the company a non-manufacturer, so a genuine manufacturer
  # reaching this carve-out is already a classification error, while an
  # over-loose carve-out silently re-admits integrators.
  integrator_manufacturer_carveouts:
    # English — "we make it" claims.
    - is a manufacturer
    - are a manufacturer
    - we manufacture
    - manufactures
    - leading manufacturer
    - largest manufacturer
    - we produce
    - we run our plant
    - our factory
    - our factories
    - our plant
    - our own plant
    - our production facilit
    - our manufacturing plant
