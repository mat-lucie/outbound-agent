    - sales
    - account executive
    - account manager
    - key account
    - business development
    - biz dev
    - channel manager
    - partnerships
    - customer success
    - customer experience
    - growth
    - marketing
    - go-to-market
    - gtm
    - revenue operations
    - revops
    - pre-sales
    - presales
