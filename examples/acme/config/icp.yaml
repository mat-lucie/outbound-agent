  # ── Integrator / service-provider COMPANY family (DESCRIPTION-keyed) ──
  # "IS a manufacturer" vs "SELLS to manufacturers". A small automation
  # integrator looks like an in-ICP plant on every other signal: its CRM
  # categories are Machinery / Industrials & Manufacturing, its people carry
  # plant-coded titles, and its company NAME is often a bare brand with no
  # service token to catch. The company DESCRIPTION is the one field that
  # states the business model.
