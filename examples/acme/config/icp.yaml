# ── Industry ICP buckets ──────────────────────────────────────────────
# In-ICP labels are physical-product manufacturers (get +industry_bonus_in_icp).
# "Other" is the classifier's "not a manufacturer" signal (gets the penalty).
# Membership is case-sensitive: callers pass canonical capitalized labels.
industries:
  in_icp:
    - Manufacturing
    - Food & Beverage
    - Construction
    - Oil & Gas
    - Mining
    - Automotive
    - Textiles
    - Packaging
    - Chemicals
    - Pharma
    - Software
    - Technology
    - Retail
    - Healthcare
    - Financial Services
    - Logistics
  off_icp:
    - Other

# ── Scoring weights ───────────────────────────────────────────────────
# Numeric deltas applied by the scorers. Changing these shifts scores; the
# combination LOGIC (which delta fires when) is fixed in quality_gate.py.
weights:
  industry_bonus_in_icp: 12       # in-ICP industry boost
  industry_penalty_off_icp: -25   # "Other" / non-manufacturer penalty
  # Combined bonus when an ops-domain influencer is at an in-ICP industrial
  # company. The role+industry signals are correlated, so this single joint
  # signal replaces the additive +24 role + +12 industry.
  ops_in_industrial_combined: 30

# ── Thresholds / score bands ──────────────────────────────────────────
# Band labels track the verdict-path branches in score_prospect:
# <40 deterministic_reject, 40-59 borderline-reject side, 60-75 borderline-pass
# side, >75 deterministic pass. Order matters (low → high).
thresholds:
  score_band_labels:
    - "<40"
    - "40-59"
    - "60-75"
    - ">75"

# ── Disqualifier keyword families ─────────────────────────────────────
