[project]
name = "outbound-agent"
version = "0.1.0"
description = "CRM-agnostic autonomous B2B outbound engine"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "gspread>=6.0",
    "google-auth>=2.0",
    "anthropic>=0.27.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyyaml>=6.0",  # F-PR-3.5: docs/attio_schema_deltas.yaml + scripts/validate_attio_schema_deltas.py
    "jinja2>=3.1",  # P2: config/prompts/qualifier.md.j2 prompt template rendering
    "psutil>=5.9",  # F-PR-7: workflows/run_lock.py PID + create_time stale-detection
]

[project.scripts]
sales = "cli:cli"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["clients*", "content*", "models*", "scripts*", "workflows*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "vulture>=2.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
